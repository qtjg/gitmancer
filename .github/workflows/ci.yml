name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: node --check gitmancer.js && node --check test/mock.e2e.js

      - name: Version smoke
        run: node gitmancer.js version

      - name: Help smoke
        run: node gitmancer.js help

      - name: End-to-end tests (mock AI + mock GitHub)
        run: node test/mock.e2e.js
